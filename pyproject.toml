[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-strategic-exploration"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2"]

[project.optional-dependencies]
meta = ["matplotlib>=3.8", "pytest>=8"]

[project.scripts]
meta-exploration = "meta_exploration.__main__:main"
marl-experiment = "marl.cli:main"

[tool.setuptools.packages.find]
include = ["marl*", "meta_exploration*"]
